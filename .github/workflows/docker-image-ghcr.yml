name: Publish container image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build uniquely tagged image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          IMAGE_REF="${IMAGE_NAME}:${TAG}"
          docker buildx build --platform linux/amd64 --load -t "${IMAGE_REF}" .
          echo "ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"

      - name: Smoke-test image before publishing
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REF="${{ steps.image.outputs.ref }}"
          docker run -d --name serve-publish-smoke -p 3838:3838 "${IMAGE_REF}"
          trap 'docker logs serve-publish-smoke || true; docker rm -f serve-publish-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error "http://127.0.0.1:3838/" >/dev/null; then
              echo "Container is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy"
          exit 1

      - name: Push validated image
        shell: bash
        run: docker push "${{ steps.image.outputs.ref }}"

      - name: Deployment note
        shell: bash
        run: |
          {
            echo "## SciLifeLab Serve image"
            echo
            echo '```text'
            echo "${{ steps.image.outputs.ref }}"
            echo '```'
            echo
            echo "Make the GHCR package Public, then use this exact unique image tag in Serve. Do not replace it with latest."
            echo
            echo "Serve form: Shiny app, port 3838."
          } >> "$GITHUB_STEP_SUMMARY"
